<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bråkspel</title>
<style>
body{
font-family:Arial,sans-serif;
background:#edf2f7;
margin:0;
padding:20px;
}
.box{
max-width:800px;
margin:auto;
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,.1);
}
h1{text-align:center;color:#2563eb}
h2{text-align:center}
.level{
padding:18px;
border-radius:14px;
color:white;
font-size:22px;
font-weight:bold;
margin:12px 0;
cursor:pointer;
text-align:center;
}
.green{background:#16a34a}
.yellow{background:#f59e0b;color:black}
.red{background:#dc2626}
.top{
display:flex;
justify-content:space-between;
font-weight:bold;
margin-bottom:10px;
}
.bar{
height:12px;
background:#ddd;
border-radius:99px;
overflow:hidden;
}
.fill{
height:100%;
width:0;
background:#2563eb;
}
#context{
text-align:center;
min-height:40px;
color:#555;
margin-top:15px;
}
#question{
font-size:42px;
text-align:center;
margin:25px;
font-weight:bold;
}
.answer{
width:100%;
padding:14px;
margin:8px 0;
font-size:22px;
border-radius:12px;
border:2px solid #ddd;
background:white;
cursor:pointer;
}
.answer:hover{border-color:#2563eb}
.feedback{
padding:14px;
border-radius:12px;
font-weight:bold;
margin-top:15px;
display:none;
}
.ok{background:#dcfce7;color:#166534}
.no{background:#fee2e2;color:#991b1b}
.next{
margin-top:18px;
width:100%;
padding:14px;
font-size:18px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
display:none;
cursor:pointer;
}
.back{
margin-bottom:15px;
color:#2563eb;
cursor:pointer;
font-weight:bold;
}
.result{
text-align:center;
display:none;
}
.big{
font-size:54px;
color:#2563eb;
}
.small{
font-size:14px;
color:#666;
}
</style>
</head>
<body>

<div class="box">

<div id="menu">
<h1>🧮 Bråk × heltal</h1>
<p style="text-align:center">Välj nivå • 30 uppgifter per nivå</p>

<div class="level green" onclick="start(1)">
🟢 Nivå 1 – Grunder
</div>

<div class="level yellow" onclick="start(2)">
🟡 Nivå 2 – Förkorta
</div>

<div class="level red" onclick="start(3)">
🔴 Nivå 3 – Utmaning
</div>

<p class="small">
Eleverna får direkt feedback och kan spela om nivåerna hur många gånger de vill.
</p>

</div>

<div id="game" style="display:none">

<div class="back" onclick="home()">← Till startsidan</div>

<div class="top">
<div id="nr"></div>
<div id="score"></div>
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div id="context"></div>

<div id="question"></div>

<div id="answers"></div>

<div id="feedback" class="feedback"></div>

<button id="next" class="next" onclick="nextQ()">
Nästa uppgift
</button>

</div>

<div id="result" class="result">

<h2>🎉 Bra jobbat!</h2>

<div class="big" id="finalScore"></div>

<p id="message"></p>

<button class="next" style="display:block" onclick="start(level)">
Spela samma nivå igen
</button>

<button class="next" style="display:block;background:#64748b" onclick="home()">
Till startsidan
</button>

</div>

</div>

<script>

const TOTAL=30;

let level=1;
let index=0;
let score=0;
let questions=[];
let correct="";

function gcd(a,b){
while(b){
let t=a%b;
a=b;
b=t;
}
return Math.abs(a);
}

function simp(a,b){
let g=gcd(a,b);
a/=g;
b/=g;
if(b===1)return a+"";
return a+"/"+b;
}

function shuffle(arr){
return arr.sort(()=>Math.random()-.5);
}

function makeQuestion(){

let n,d,w,text="";

if(level===1){

d=2+Math.floor(Math.random()*8);
n=1+Math.floor(Math.random()*(d-1));
w=2+Math.floor(Math.random()*8);

}

if(level===2){

const den=[2,3,4,5,6,8,10,12];
d=den[Math.floor(Math.random()*den.length)];
n=2+Math.floor(Math.random()*(d-1));
w=3+Math.floor(Math.random()*9);

}

if(level===3){

if(Math.random()<0.35){

d=[2,3,4,5,8][Math.floor(Math.random()*5)];
n=1+Math.floor(Math.random()*(d-1));
w=2+Math.floor(Math.random()*6);

text=`En elev går ${n}/${d} km varje dag. Hur långt går eleven på ${w} dagar?`;

}else{

d=[8,9,10,12][Math.floor(Math.random()*4)];
n=5+Math.floor(Math.random()*(d-4));
w=6+Math.floor(Math.random()*10);

}

}

correct=simp(n*w,d);

let alt=[correct];

while(alt.length<4){

let fel=simp(
Math.max(1,n*w+Math.floor(Math.random()*5)-2),
d+(Math.random()<0.3?1:0)
);

if(!alt.includes(fel))alt.push(fel);

}

return{
text,
q:`${w} × ${n}/${d}`,
correct,
options:shuffle(alt)
};

}

function build(){
questions=[];
for(let i=0;i<TOTAL;i++){
questions.push(makeQuestion());
}
}

function start(l){

level=l;
index=0;
score=0;

build();

document.getElementById("menu").style.display="none";
document.getElementById("result").style.display="none";
document.getElementById("game").style.display="block";

show();

}

function show(){

let q=questions[index];

document.getElementById("nr").innerHTML=`Uppgift ${index+1} / ${TOTAL}`;

document.getElementById("score").innerHTML=`Rätt: ${score}`;

document.getElementById("fill").style.width=(index/TOTAL*100)+"%";

document.getElementById("context").innerHTML=q.text;

document.getElementById("question").innerHTML=q.q;

let html="";

q.options.forEach(o=>{

html+=`<button class="answer" onclick="check('${o}')">${o}</button>`;

});

document.getElementById("answers").innerHTML=html;

document.getElementById("feedback").style.display="none";

document.getElementById("next").style.display="none";

}

function check(val){

let q=questions[index];

document.querySelectorAll(".answer").forEach(b=>b.disabled=true);

let fb=document.getElementById("feedback");

fb.style.display="block";

if(val===q.correct){

score++;

fb.className="feedback ok";

fb.innerHTML="✅ Rätt!";

}else{

fb.className="feedback no";

fb.innerHTML=`❌ Rätt svar är <b>${q.correct}</b>`;

}

document.getElementById("score").innerHTML=`Rätt: ${score}`;

document.getElementById("next").style.display="block";

}

function nextQ(){

index++;

if(index===TOTAL){

finish();

}else{

show();

}

}

function finish(){

document.getElementById("game").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("finalScore").innerHTML=`${score} / ${TOTAL}`;

let msg="Fortsätt träna samma nivå!";

if(score>=27)msg="🌟 Fantastiskt! Du behärskar nivån.";

else if(score>=24)msg="👏 Mycket bra! Testa nästa nivå.";

else if(score>=21)msg="👍 Bra jobbat! Lite mer träning så sitter det.";

document.getElementById("message").innerHTML=msg;

}

function home(){

document.getElementById("menu").style.display="block";

document.getElementById("game").style.display="none";

document.getElementById("result").style.display="none";

}

</script>

</body>
</html>
