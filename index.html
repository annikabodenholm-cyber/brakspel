<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bråkmästaren</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🟢 Bråkmästaren</h1>
    <p>Välj en nivå och träna bråkmultiplikation.</p>
    <div class="buttons">
      <button class="green" onclick="startLevel(1)">Nivå 1</button>
      <button class="yellow" onclick="startLevel(2)">Nivå 2</button>
      <button class="red" onclick="startLevel(3)">Nivå 3</button>
    </div>
    <div id="game" class="hidden">
      <h2 id="levelTitle"></h2>
      <p id="question"></p>
      <input id="answer" placeholder="t.ex. 3/4 eller 2 1/3">
      <button onclick="checkAnswer()">Svara</button>
      <p id="feedback"></p>
      <p>Poäng: <span id="score">0</span></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
