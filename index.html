<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bråkmästaren – Multiplikation med bråk</title><link rel="stylesheet" href="style.css?v=20261027-2"><style>
body main > h1{
  font-size:44px !important;
  line-height:1.1 !important;
  margin:0 0 18px !important;
}
body main > .subtitle{
  font-size:20px !important;
  line-height:1.3 !important;
  margin:0 0 28px !important;
}
body main #menu .level,
body main #menu .level b{
  font-size:20px !important;
  line-height:1.2 !important;
}
body main #menu .level{
  min-height:70px !important;
  padding:16px 18px !important;
  margin-bottom:16px !important;
}
</style></head>
<body><main><h1>Bråkmästaren</h1><p class="subtitle">Multiplikation med bråk</p>
<section id="menu" class="card">
<button class="level green" data-l="1"><b>Nivå 1</b></button>
<button class="level yellow" data-l="2"><b>Nivå 2</b></button>
<button class="level orange" data-l="3"><b>Nivå 3</b></button>
<button class="level red" data-l="4"><b>Nivå 4</b></button>
</section>
<section id="game" class="card hidden"><div class="top"><button id="back" class="alt">← Byt nivå</button><b id="progress"></b></div><div class="track"><div id="bar"></div></div><p id="instruction"></p><div id="story"></div><div id="question"></div><form id="form"><label for="answer">Ditt svar</label><input id="answer" autocomplete="off" placeholder="t.ex. 3/4 eller 1 1/2"><small>Skriv bråk med /, till exempel 3/4.</small><button id="submit" type="submit">Svara</button></form><div id="feedback" class="feedback hidden"></div><div id="solution"></div><button id="next" class="hidden">Nästa uppgift</button></section>
<section id="result" class="card hidden"><h2>Nivån är klar!</h2><p id="score"></p><button id="retry">Spela nivån igen</button><button id="choose" class="alt">Välj annan nivå</button></section>
</main><script src="script.js"></script></body></html>
