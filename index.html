<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bråkmästaren</title>
<style>
body{font-family:Arial;margin:0;background:#eef4ff}
.wrap{max-width:760px;margin:20px auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
h1{text-align:center;color:#2563eb}
.level{width:100%;padding:18px;margin:12px 0;border:none;border-radius:14px;font-size:22px;font-weight:bold;cursor:pointer}
.green{background:#16a34a;color:#fff}
.yellow{background:#f59e0b}
.red{background:#dc2626;color:#fff}
.hide{display:none}
.top{display:flex;justify-content:space-between;font-weight:bold}
.bar{height:10px;background:#ddd;border-radius:99px;margin:10px 0}
.fill{height:100%;width:0;background:#2563eb;border-radius:99px}
#question{text-align:center;font-size:34px;margin:20px;font-weight:bold}
.answer{width:100%;padding:12px;margin:8px 0;border:2px solid #ddd;border-radius:12px;background:#fff;font-size:20px;cursor:pointer}
.frac{display:inline-block;text-align:center;vertical-align:middle}
.t{display:block;border-bottom:2px solid #111;padding:0 6px}
.b{display:block;padding:0 6px}
#feedback{font-weight:bold;min-height:28px;padding:8px}
.next{width:100%;padding:12px;border:none;border-radius:12px;background:#2563eb;color:#fff;font-size:18px}
</style>
</head>
<body>

<div class="wrap">
<div class="card">

<div id="menu">
<h1>🧮 Bråkmästaren</h1>
<button class="level green" onclick="start(1)">Nivå 1</button>
<button class="level yellow" onclick="start(2)">Nivå 2</button>
<button class="level red" onclick="start(3)">Nivå 3</button>
</div>

<div id="game" class="hide">
<div class="top">
<div id="prog"></div>
<div id="score"></div>
</div>

<div class="bar"><div id="fill" class="fill"></div></div>

<div id="question"></div>
<div id="answers"></div>
<div id="feedback"></div>

<button id="next" class="next hide" onclick="nextQuestion()">Nästa</button>
</div>

<div id="result" class="hide">
<h1>🎉 Klart!</h1>
<h2 id="final"></h2>
<button class="next" onclick="home()">Startsida</button>
</div>

</div>
</div>

<script>
const TOTAL=30;
let level=1;
let current=0;
let points=0;
let questions=[];

function gcd(a,b){
 while(b){[a,b]=[b,a%b]}
 return Math.abs(a)||1;
}

function simplify(n,d){
 let g=gcd(n,d);
 return [n/g,d/g];
}

function frac(n,d){
 return `<span class="frac"><span class="t">${n}</span><span class="b">${d}</span></span>`;
}

function mixed(n,d){
 let h=Math.floor(n/d);
 let r=n%d;
 if(r===0) return ""+h;
 if(h===0) return frac(r,d);
 return h+" "+frac(r,d);
}

function shuffle(arr){
 return arr.sort(()=>Math.random()-0.5);
}

function makeQuestion(){

 let den=[2,3,4,5,6,8,10,12];

 if(level===2) den=[3,4,5,6,8,9,10,12,15];
 if(level===3) den=[4,5,6,8,9,10,12,15];

 let d=den[Math.floor(Math.random()*den.length)];
 let n=1+Math.floor(Math.random()*Math.min(8,d-1));
 let w=(level===1?2:level===2?3:4)+Math.floor(Math.random()*4);

 let [sn,sd]=simplify(n*w,d);
 let right=mixed(sn,sd);

 let options=[right];

 while(options.length<4){
   let [an,ad]=simplify(Math.max(1,sn+Math.floor(Math.random()*5)-2),sd);
   let alt=mixed(an,ad);
   if(!options.includes(alt)) options.push(alt);
 }

 return{
   text: level===3 && Math.random()<0.35 ?
   `Ett recept använder ${n}/${d} dl mjöl. Hur mycket behövs till ${w} recept?`:"",
   q:`${w} × ${n}/${d}`,
   right,
   options:shuffle(options)
 };
}

function start(l){

 level=l;
 current=0;
 points=0;
 questions=[];

 for(let i=0;i<TOTAL;i++) questions.push(makeQuestion());

 document.getElementById("menu").classList.add("hide");
 document.getElementById("game").classList.remove("hide");
 document.getElementById("result").classList.add("hide");

 show();

}

function show(){

 let q=questions[current];

 document.getElementById("prog").innerHTML=`${current+1}/${TOTAL}`;
 document.getElementById("score").innerHTML=`Rätt ${points}`;
 document.getElementById("fill").style.width=(current/TOTAL*100)+"%";

 let text=q.text?`<div style="text-align:center;color:#555">${q.text}</div>`:"";

 document.getElementById("question").innerHTML=
 text+
 "<div>"+q.q.replace(/(\d+)\/(\d+)/,(_,a,b)=>frac(a,b))+"</div>";

 let html="";

 q.options.forEach(v=>{
   html+=`<button class="answer" onclick="check('${v}')">${v}</button>`;
 });

 document.getElementById("answers").innerHTML=html;
 document.getElementById("feedback").innerHTML="";
 document.getElementById("next").classList.add("hide");

}

function check(v){

 [...document.querySelectorAll(".answer")].forEach(b=>b.disabled=true);

 if(v===questions[current].right){
   points++;
   document.getElementById("feedback").innerHTML="✅ Rätt!";
 }else{
   document.getElementById("feedback").innerHTML=
   "❌ Rätt svar: "+questions[current].right;
 }

 document.getElementById("score").innerHTML=`Rätt ${points}`;
 document.getElementById("next").classList.remove("hide");

}

function nextQuestion(){

 current++;

 if(current===TOTAL){

   document.getElementById("game").classList.add("hide");
   document.getElementById("result").classList.remove("hide");
   document.getElementById("final").innerHTML=`${points} av ${TOTAL} rätt`;
   return;

 }

 show();

}

function home(){

 document.getElementById("menu").classList.remove("hide");
 document.getElementById("game").classList.add("hide");
 document.getElementById("result").classList.add("hide");

}
</script>

</body>
</html>
