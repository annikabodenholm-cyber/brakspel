<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bråkspel</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#eef2f7;
  display:flex;
  justify-content:center;
  padding:30px;
}
.box{
  background:white;
  max-width:700px;
  width:100%;
  padding:30px;
  border-radius:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
}
h1{color:#2563eb;text-align:center}
button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
}
.green{background:#16a34a;color:white}
.yellow{background:#facc15}
.red{background:#dc2626;color:white}
</style>
</head>
<body>
<div class="box">
  <h1>🧮 Bråk × heltal</h1>
  <p>Välkommen till bråkspelet!</p>

  <button class="green">Nivå 1 – 30 uppgifter</button>
  <button class="yellow">Nivå 2 – 30 uppgifter</button>
  <button class="red">Nivå 3 – 30 uppgifter</button>
