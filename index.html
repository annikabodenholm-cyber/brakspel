<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bråkmästaren</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Bråkmästaren</h1><p class="subtitle">Multiplikation med bråk</p><section id="menu" class="card"><h2>Välj nivå</h2><button class="level green" data-l="1"><b>Nivå 1</b><span>Bråk med mindre tal</span></button><button class="level yellow" data-l="2"><b>Nivå 2</b><span>Svårare bråk</span></button><button class="level red" data-l="3"><b>Nivå 3</b><span>Många textproblem</span></button></section><section id="game" class="card hidden"><div class="top"><button id="back" class="alt">← Byt nivå</button><b id="progress"></b></div><div class="track"><div id="bar"></div></div><p id="label"></p><h2 id="question"></h2><form id="form"><label for="answer">Ditt svar</label><input id="answer" autocomplete="off" placeholder="t.ex. 3/4 eller 1 1/2"><small>Använd / för bråkstreck.</small><button id="submit" type="submit">Svara</button></form><div id="feedback" class="feedback hidden"></div><button id="next" class="hidden">Nästa uppgift</button></section><section id="result" class="card hidden"><h2>Nivån är klar!</h2><p id="score"></p><button id="retry">Spela nivån igen</button><button id="choose" class="alt">Välj annan nivå</button></section></main><script src="script.js"></script></body></html>
